version: "3.9"

services:
  # ============================================================================
  # 1. PostgreSQL Database Service (Ultra-lightweight Alpine image ~40MB)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: invoice_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-invoices}
    # Low-spec memory optimization flags (reduces RAM usage significantly)
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c max_connections=30
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-invoices}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - invoice_net

  # ============================================================================
  # 2. FastAPI Backend & LangGraph AI Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoice_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-invoices}
      - ENVIRONMENT=development
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL:-gemini-2.5-flash}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-models/text-embedding-004}
      - VECTOR_STORE_PROVIDER=${VECTOR_STORE_PROVIDER:-auto}
      - FAISS_INDEX_DIR=/app/data/faiss_index
      - OCR_ENGINE=${OCR_ENGINE:-gemini_vision}
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production-1234567890}
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      # Persistent storage for invoice PDF/image uploads and local FAISS indexes
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - invoice_net

# ==============================================================================
# Persistent Named Volumes & Network Definitions
# ==============================================================================
volumes:
  postgres_data:
    driver: local

networks:
  invoice_net:
    driver: bridge
