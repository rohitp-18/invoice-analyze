version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoice_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-invoices}
      - ENVIRONMENT=development
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL:-gemini-2.5-flash}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-models/text-embedding-004}
      - VECTOR_STORE_PROVIDER=${VECTOR_STORE_PROVIDER:-auto}
      - FAISS_INDEX_DIR=/app/data/faiss_index
      - OCR_ENGINE=${OCR_ENGINE:-gemini_vision}
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production-1234567890}
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      # Persistent storage for invoice PDF/image uploads and local FAISS indexes
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    # Explicit command to run database table creation & column migrations before launching Uvicorn
    command: >
      sh -c "alembic upgrade head 2>/dev/null || true &&
             python -c 'from app.database import engine, run_column_migrations; from app.models import Base; Base.metadata.create_all(bind=engine); run_column_migrations(); print(\"[OK] [Docker Startup] Database tables & column migrations verified successfully.\")' &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - invoice_net

networks:
  invoice_net:
    driver: bridge
